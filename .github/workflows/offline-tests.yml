name: Offline retrieval and evaluation tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify retrieval metadata and evaluation metrics
        run: python -S -m unittest discover -s offline_tests -v
      - name: Reproduce synthetic evaluation example
        run: >-
          python -S -m eval.offline_eval
          --questions eval/questions.example.json
          --candidates eval/candidates.example.json
          --output-dir eval/reports/demo
      - name: Save synthetic example reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.python-version }}
          path: eval/reports/demo/
          if-no-files-found: error
